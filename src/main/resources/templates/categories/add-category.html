<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Danh Mục Mới - SaleApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🛒 SALEAPP V1</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Trang Chủ</a>
            <a class="nav-link" th:href="@{/products}">Sản Phẩm</a>
            <a class="nav-link" th:href="@{/categories}">Danh Mục</a>
            <a class="nav-link" th:href="@{/products/add}">+ Thêm Sản Phẩm</a>
            <a class="nav-link active" th:href="@{/categories/add}">+ Thêm Danh Mục</a>
        </div>
    </div>
</nav>

<div class="container mt-2" style="max-width: 550px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Thêm Danh Mục Mới</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/categories/add}" th:object="${category}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Tên danh mục: <span class="text-danger">*</span></label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required placeholder="Nhập tên danh mục...">
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/categories}" class="btn btn-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Xác Nhận</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

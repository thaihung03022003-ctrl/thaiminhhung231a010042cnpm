<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Danh Mục - SaleApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🛒 SALEAPP V1</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Trang Chủ</a>
            <a class="nav-link" th:href="@{/products}">Sản Phẩm</a>
            <a class="nav-link active" th:href="@{/categories}">Danh Mục</a>
            <a class="nav-link" th:href="@{/products/add}">+ Thêm Sản Phẩm</a>
            <a class="nav-link" th:href="@{/categories/add}">+ Thêm Danh Mục</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh Sách Danh Mục</h2>
        <div>
            <a th:href="@{/categories/add}" class="btn btn-primary">+ Thêm Danh Mục Mới</a>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>Tên Danh Mục</th>
                    <th style="width: 160px;" class="text-center">Hành Động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="3" class="text-center text-muted py-4">Chưa có danh mục nào. Hãy nhấn "+ Thêm Danh Mục Mới" để tạo!</td>
                </tr>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}"></td>
                    <td class="fw-semibold" th:text="${category.name}"></td>
                    <td class="text-center">
                        <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-warning btn-sm me-1">Sửa</a>
                        <a th:href="@{/categories/delete/{id}(id=${category.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này không?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
